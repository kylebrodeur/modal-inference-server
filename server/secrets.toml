# Declarative list of the Modal Secrets this app consumes.
# generate: the tool creates the value (never printed). ask: prompted from the user.
# Values are written to Modal only; nothing touches disk, shells, or logs.

[secret.auth]
name = "inference-auth-secret"
[secret.auth.keys.API_TOKEN]
generate = "hex32"

[secret.dashboard]
name = "modal-inference-server-dashboard"
[secret.dashboard.keys.MODAL_INFERENCE_DASHBOARD_TOKEN]
generate = "hex32"

[secret.hf]
name = "modal-inference-server-huggingface"
[secret.hf.keys.HF_TOKEN]
ask = "Hugging Face token (gated model downloads)"